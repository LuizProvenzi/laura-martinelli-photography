<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laura Martinelli</title>
<meta name="description" content="Laura Martinelli — fotógrafa de eventos, retratos e apresentações.">
<meta name="theme-color" content="#0a0a0b">

<!-- Tab icon: a camera drawn as vector paths rather than an emoji glyph. An
     emoji sits wherever the reader's emoji font puts it, which is why it hung
     low and could not be corrected reliably; these coordinates are centred in
     the viewBox by construction. The lens is a hole punched with evenodd, so
     the icon works on any tab colour, and the fill flips in dark mode. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Cstyle%3Epath%7Bfill:%23111112%7D%40media%28prefers-color-scheme:dark%29%7Bpath%7Bfill:%23f2f0ec%7D%7D%3C/style%3E%3Cpath%20fill-rule='evenodd'%20d='M18,28%20h14%20l5,-10%20h26%20l5,10%20h14%20a8,8%200%200%201%208,8%20v38%20a8,8%200%200%201%20-8,8%20h-64%20a8,8%200%200%201%20-8,-8%20v-38%20a8,8%200%200%201%208,-8%20Z%20M63,55%20a13,13%200%201%201%20-26,0%20a13,13%200%201%201%2026,0%20Z'/%3E%3C/svg%3E">

<meta property="og:title" content="Laura Martinelli">
<meta property="og:image" content="photos/web/portrait.webp">
<meta property="og:type" content="website">

<style>
  :root{
    /* Warm off-white rather than #fff: the drop from the hero's black is long,
       and pure white makes it a harder landing than it needs to be. */
    --bg:#faf9f7;
    --ink:#111112;

    /* Deliberately darker than the portrait's own edge (which sits at RGB 35).
       The photograph reads as a distinct object on the band rather than
       dissolving into it — a frame, not a merge. */
    --hero-bg:#0a0a0b;
    --hero-ink:#f2f0ec;

    /* Sans-serif counterpoint to the Times name. Also a system stack, so it
       costs nothing to load. */
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;

    --gap:10px;
    --max-width:1240px;
  }

  *{margin:0;padding:0;box-sizing:border-box}

  body{
    background:var(--bg);
    color:var(--ink);
    /* A system font, so nothing is downloaded and the page has no external
       requests at all. Times only ships regular and bold — no light weights. */
    font-family:'Times New Roman',Times,serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- HERO ----------
     The portrait is roughly square, so it cannot fill a widescreen the way a
     landscape hero does — it would have to be cropped to a strip. The viewport
     is split instead: the photo keeps its own shape on one side, the name
     occupies the space left over. Nothing is cropped, nothing is upscaled. */
  .hero{
    background:var(--hero-bg);
    color:var(--hero-ink);
    /* Barely-there lift at the top so the black reads as depth, not as ink. */
    background-image:linear-gradient(to bottom,#111113 0%,var(--hero-bg) 55%);
  }

  .hero__inner{
    max-width:var(--max-width);
    margin:0 auto;
    padding:clamp(2.5rem,8vh,5rem) clamp(1.25rem,3vw,1.5rem) clamp(3rem,9vh,5.5rem);
    display:flex;
    align-items:center;
    gap:clamp(1.75rem,5vw,4.5rem);
  }

  .hero__intro{flex:1 1 auto;min-width:0}

  .hero__name{
    font-size:clamp(1.9rem,4.6vw,3.75rem);
    font-weight:400;
    line-height:1;
    letter-spacing:.03em;
    text-transform:uppercase;
  }
  .hero__name span{display:block;font-weight:700}

  /* Sans against the serif name, and roughly a twentieth of its size. The
     tracking is what keeps a word this small from looking like a leftover:
     spread out, it reads as a mark rather than as body text. */
  .hero__craft{
    margin-top:clamp(.9rem,2.2vh,1.35rem);
    font-family:var(--sans);
    font-size:clamp(.66rem,1vw,.76rem);
    letter-spacing:.44em;
    text-transform:uppercase;
    color:#96918a;
  }

  .hero__social{
    display:inline-flex;
    align-items:center;
    gap:.55em;
    margin-top:clamp(1.4rem,3.5vh,2.1rem);
    font-family:var(--sans);
    font-size:clamp(.74rem,1.05vw,.83rem);
    letter-spacing:.06em;
    color:#b0aba4;
    text-decoration:none;
    transition:color .3s ease;
  }
  .hero__social:hover,
  .hero__social:focus-visible{color:var(--hero-ink)}
  .hero__social svg{
    width:1.25em;
    height:1.25em;
    flex:none;          /* never let the glyph squash next to the text */
  }

  /* Sized by width, not height: keeps the name's share of the row predictable
     at every screen size. The portrait is near-square, so it needs a wider
     share than a tall one would to carry the same visual weight. */
  .hero__portrait{flex:0 0 clamp(240px,46%,560px)}
  .hero__portrait img{display:block;width:100%;height:auto}

  /* ---------- JUSTIFIED GALLERY ----------
     Three photographs per row, three rows, at every screen size. On a phone
     the same arrangement simply scales down.

     Each tile's flex-grow is its aspect ratio (width / height) with
     flex-basis: 0, so widths come out proportional to each image's shape.
     Two consequences fall out of that, and they hold at any width: every tile
     in a row lands on exactly the same height, and the row fills the width to
     the pixel. Nothing is cropped, and no media query touches the gallery. */
  .gallery{
    max-width:var(--max-width);
    margin:0 auto;
    /* Breathing room between the dark band and the first photographs. */
    padding:clamp(2.75rem,8vh,5rem) clamp(1.25rem,3vw,1.5rem) clamp(3rem,9vh,6rem);
    display:flex;
    flex-direction:column;
    gap:var(--gap);
  }

  .row{display:flex;gap:var(--gap)}

  .tile{
    flex:var(--ratio) 1 0;
    min-width:0;
    cursor:zoom-in;
    opacity:0;
    transform:translateY(14px);
    transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1);
  }
  .tile.visible{opacity:1;transform:none}

  .tile img{
    display:block;
    width:100%;
    height:auto;          /* keeps the original aspect ratio */
    transition:opacity .5s ease;
  }
  .tile:hover img{opacity:.82}

  /* ---------- LIGHTBOX ---------- */
  .lightbox{
    position:fixed;
    inset:0;
    z-index:50;
    background:rgba(250,249,247,.985);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4vh 5vw;
    opacity:0;
    pointer-events:none;
    transition:opacity .35s ease;
    cursor:zoom-out;
  }
  .lightbox.open{opacity:1;pointer-events:auto}
  .lightbox img{width:auto;max-width:100%;max-height:92vh;object-fit:contain}

  @media(max-width:720px){
    :root{--gap:8px}
    /* Not enough width for a split: name on top, portrait full width below. */
    .hero__inner{
      flex-direction:column;
      align-items:stretch;
      gap:clamp(1.5rem,4vh,2.25rem);
    }
    .hero__portrait{flex:0 0 auto}
  }

  @media(prefers-reduced-motion:reduce){
    *{transition:none !important}
    .tile{opacity:1;transform:none}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero__inner">
    <div class="hero__intro">
      <h1 class="hero__name">Laura<span>Martinelli</span></h1>
      <p class="hero__craft">Fotografia</p>
      <a class="hero__social" href="https://instagram.com/llmartinelli"
         target="_blank" rel="noopener noreferrer">
        <!-- Instagram mark drawn inline: keeps the page free of external
             requests, and stroke="currentColor" makes it follow the link's
             hover colour without a second rule. -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.6" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5.2"/>
          <circle cx="12" cy="12" r="4.1"/>
          <circle cx="17.3" cy="6.7" r="1.15" fill="currentColor" stroke="none"/>
        </svg>
        <span>@llmartinelli</span>
      </a>
    </div>
    <figure class="hero__portrait">
      <img src="photos/web/portrait.webp" width="1737" height="1800"
           srcset="photos/web/portrait-sm.webp 868w, photos/web/portrait.webp 1737w"
           sizes="(max-width:720px) 92vw, 46vw"
           alt="Laura Martinelli" fetchpriority="high">
    </figure>
  </div>
</header>

<main class="gallery">

  <!-- The three rows carry near-identical ratio sums (1.85 / 1.84 / 1.99), so
       they resolve to near-identical heights: the grid reads as a grid rather
       than as three rows that happen to sit above one another. Each tile's
       sizes value is its share of its own row, which is why they add to 100vw
       within a row and differ between rows. -->

  <div class="row">
    <figure class="tile" style="--ratio:.5617">
      <img src="photos/web/IMG_2089.webp" width="1011" height="1800"
           srcset="photos/web/IMG_2089-sm.webp 505w, photos/web/IMG_2089.webp 1011w"
           sizes="30vw"
           data-full="photos/web/IMG_2089.webp" alt="" loading="lazy">
    </figure>
    <figure class="tile" style="--ratio:.6261">
      <img src="photos/web/IMG_2225.webp" width="1127" height="1800"
           srcset="photos/web/IMG_2225-sm.webp 564w, photos/web/IMG_2225.webp 1127w"
           sizes="34vw"
           data-full="photos/web/IMG_2225.webp" alt="" loading="lazy">
    </figure>
    <figure class="tile" style="--ratio:.6667">
      <img src="photos/web/IMG_5172.webp" width="1200" height="1800"
           srcset="photos/web/IMG_5172-sm.webp 600w, photos/web/IMG_5172.webp 1200w"
           sizes="36vw"
           data-full="photos/web/IMG_5172.webp" alt="" loading="lazy">
    </figure>
  </div>

  <div class="row">
    <figure class="tile" style="--ratio:.6100">
      <img src="photos/web/IMG_2364.webp" width="1098" height="1800"
           srcset="photos/web/IMG_2364-sm.webp 549w, photos/web/IMG_2364.webp 1098w"
           sizes="33vw"
           data-full="photos/web/IMG_2364.webp" alt="" loading="lazy">
    </figure>
    <figure class="tile" style="--ratio:.6667">
      <img src="photos/web/IMG_0160.webp" width="1200" height="1800"
           srcset="photos/web/IMG_0160-sm.webp 600w, photos/web/IMG_0160.webp 1200w"
           sizes="36vw"
           data-full="photos/web/IMG_0160.webp" alt="" loading="lazy">
    </figure>
    <figure class="tile" style="--ratio:.5622">
      <img src="photos/web/IMG_5127.webp" width="1012" height="1800"
           srcset="photos/web/IMG_5127-sm.webp 506w, photos/web/IMG_5127.webp 1012w"
           sizes="31vw"
           data-full="photos/web/IMG_5127.webp" alt="" loading="lazy">
    </figure>
  </div>

  <div class="row">
    <figure class="tile" style="--ratio:.5611">
      <img src="photos/web/IMG_1981.webp" width="1010" height="1800"
           srcset="photos/web/IMG_1981-sm.webp 505w, photos/web/IMG_1981.webp 1010w"
           sizes="28vw"
           data-full="photos/web/IMG_1981.webp" alt="" loading="lazy">
    </figure>
    <figure class="tile" style="--ratio:.6667">
      <img src="photos/web/IMG_0949.webp" width="1200" height="1800"
           srcset="photos/web/IMG_0949-sm.webp 600w, photos/web/IMG_0949.webp 1200w"
           sizes="34vw"
           data-full="photos/web/IMG_0949.webp" alt="" loading="lazy">
    </figure>
    <figure class="tile" style="--ratio:.7589">
      <img src="photos/web/IMG_2203.webp" width="1366" height="1800"
           srcset="photos/web/IMG_2203-sm.webp 683w, photos/web/IMG_2203.webp 1366w"
           sizes="38vw"
           data-full="photos/web/IMG_2203.webp" alt="" loading="lazy">
    </figure>
  </div>

</main>

<div class="lightbox" id="lightbox"><img src="" alt=""></div>

<script>
  const tiles = Array.from(document.querySelectorAll('.tile'));

  // Fade each tile in as it scrolls into view.
  const revealer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        revealer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.08, rootMargin: '0px 0px -5% 0px' });

  tiles.forEach((tile, i) => {
    // Stagger within the row, not across the whole gallery: three per row, so
    // the delay resets on every row and each one fades in left to right.
    tile.style.transitionDelay = (i % 3) * 0.06 + 's';
    revealer.observe(tile);
  });

  // Click a photo to open it large.
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = lightbox.querySelector('img');

  tiles.forEach((tile) => {
    tile.addEventListener('click', () => {
      lightboxImg.src = tile.querySelector('img').dataset.full;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    });
  });

  function closeLightbox() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }

  lightbox.addEventListener('click', closeLightbox);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLightbox();
  });
</script>

</body>
</html>
